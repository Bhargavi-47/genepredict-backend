services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: genepredict_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: genepredict_db
    ports:
      - "5432:5432"
    volumes:
      - genepredict_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genepredict_user -d genepredict_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://genepredict_user:changeme@db:5432/genepredict_db
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  genepredict_pgdata:
